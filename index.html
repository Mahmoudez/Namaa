function analyticsExam(id){let e=db.exams.find(x=>x.id===id);if(!e)return emptyState('Assessment not found.');let subs=Object.values(db.subs[e.id]||{}),avg=subs.length?Math.round(subs.reduce((a,x)=>a+x.percent,0)/subs.length):0,correct=e.questions.map((q,i)=>{let all=Object.values(db.subs[e.id]||{});return all.length?Math.round(all.filter(x=>x.answers[i]===q.answer).length/all.length*100):0}),dist=[0,0,0,0,0];subs.forEach(s=>dist[Math.min(4,Math.floor(s.percent/20))]++);let tops=Object.entries(db.subs[e.id]||{}).sort((a,b)=>b[1].percent-a[1].percent).slice(0,3);return `${pageTitle('TEACHER INSIGHTS',e.title)}<div class="grid2"><div class="kpi"><div class="muted">Class average</div><div class="metric">${avg}%</div></div><div class="kpi"><div class="muted">Submissions</div><div class="metric">${subs.length}</div></div></div><div class="section">Score distribution</div><div class="card"><div class="hist">${dist.map((n,i)=>`<i style="height:${Math.max(5,n/Math.max(1,subs.length)*80)}%"><small>${i*20}${i===4?'+':''}</small></i>`).join('')}</div></div><div class="section">Question difficulty</div><div class="card">${e.questions.map((q,i)=>`<div class="listrow"><div><b>Q${i+1} · ${esc(q.q)}</b><div class="tiny">${correct[i]}% answered correctly</div></div>${correct[i]<50?'<span class="badge low">Hardest</span>':''}</div>`).join('')}</div><div class="section">Top performers</div>${studentCards(tops.map(x=>findUser(x[0])).filter(Boolean))}<div class="section">Students to check in with</div>${studentCards(ownStudents().filter(s=>(db.subs[e.id]?.[s.id]?.percent??100)<60))}`}

function focusMarkup(){let e=db.exams.find(x=>x.id===focusExam);if(!e)return'';let state=db.sessions[`${current}_${e.id}`]||{start:examStart,answers:{},flags:[],order:{}};let q=e.questions[qAt],ans=state.answers[qAt],remaining=Math.max(0,e.duration*60-Math.floor((now()-state.start)/1000)),c=2*Math.PI*34,offset=c*(1-remaining/(e.duration*60));let options=q.options.map((o,i)=>({o,i}));if(e.shuffle&&state.order[qAt])options=state.order[qAt].map(i=>({o:q.options[i],i}));return `<section class="focus" id="focus" data-swipe><header class="focus-top"><button class="iconbtn" data-act="leave-exam" aria-label="Exit exam">${icon('close')}</button><div style="text-align:center"><b>${esc(e.title)}</b><div class="tiny">${esc(e.subject)} · Focus mode</div></div><div class="timer-ring ${remaining<=60?'danger':remaining<=180?'warn':''}" id="timer-ring"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="timer-circle" cx="40" cy="40" r="34" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" transform="rotate(-90 40 40)" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></svg><span id="timer-text">--:--</span></div></header><div class="focus-body"><div class="row"><span class="pill">Question ${qAt+1} of ${e.questions.length}</span><span class="tiny" id="save-status">${state.saved?`Saved ${Math.max(1,Math.floor((now()-state.saved)/1000))}s ago`:'Saved just now'}</span></div><div class="progress"><i style="width:${(qAt+1)/e.questions.length*100}%"></i></div><div class="row" style="margin:22px 0"><h2 style="font-size:20px;margin:0">${esc(q.q)}</h2><button class="iconbtn" data-act="flag" aria-label="Mark for review" style="color:${state.flags.includes(qAt)?'var(--amber)':'var(--muted)'}">${icon('flag')}</button></div>${options.map(({o,i})=>`<button class="option ${ans===i?'selected':''}" data-act="answer" data-q="${qAt}" data-answer="${i}"><kbd>${String.fromCharCode(65+i)}</kbd>${esc(o)}</button function startExam(id){let e=db.exams.find(x=>x.id===id);if(!e||me().role!=='student'||e.classId!==me().classId)return toast('This assessment is not assigned to your account.');if(e.date>now())return toast('This assessment opens on its scheduled date.');focusExam=id;qAt=0;let key=`${current}_${id}`;db.sessions[key] ||= {start:now(),answers:{},flags:[],order:{}};if(e.shuffle)e.questions.forEach((q,i)=>db.sessions[key].order[i] ||= q.options.map((_,j)=>j).sort(()=>Math.random()-.5));examStart=db.sessions[key].start;persist();render()}

function startTour(){tourStep=1;render()}function onLogin(id){current=id;db.session=id;screen='Home';child=findUser(id)?.children?.[0]||'s1';persist();render()}
function handler(act,id,el){switch(act){case'login':{let u=db.users.find(x=>x.email===$('#login-email').value.trim().toLowerCase()&&x.password===$('#login-password').value);if(!u)return toast('Email or password not recognized.');onLogin(u.id);break}case'logout':current=null;db.session=null;render();break;case'toggle-theme':db.settings.theme=db.settings.theme==='light'?'dark':'light';persist();render();break;case'notifications':navTo('Notifications');break;case'go':navTo(id);break;case'skip-splash':activitySeq=1;render();break;case'tour':startTour();break;case'tour-next':tourStep=tourStep>=4?0:tourStep+1;render();break;case'tour-skip':tourStep=0;render();break;case'reset':if(confirm('Reset all Namaa demo data and return to sign in?')){try{localStorage.removeItem('namaa_demo')}catch(e){}db=fresh();loadDB();current=null;db.session=null;screen='Home';persist();render()}break;case'start-exam':startExam(id);break;case'leave-exam':if(confirm('Leave this assessment? Your answers are saved.')){focusExam=null;clearInterval(examTicker);persist();render()}break;case'answer':saveAnswer(+el.dataset.q,+el.dataset.answer);break;case'flag':{let st=db.sessions[`${current}_${focusExam}`];st.flags.includes(qAt)?st.flags=st.flags.filter(x=>x!==qAt):st.flags.push(qAt);persist();render();break}case'prev-q':qAt=Math.max(0,qAt-1);render();break;case'next-q':qAt=Math.min(db.exams.find(x=>x.id===focusExam).questions.length-1,qAt+1);render();break;case'jump-q':qAt=+el.dataset.q;render();break;case'submit-exam':submitExam(false);break;case'confirm-submit':sheet=null;submitExam(true);break;case'result':{let e=db.exams.find(x=>x.id===id),r=db.subs[id]?.[current];if(e&&r)showResult(e,r);break}case'close-sheet':sheet=null;render();break;case'create-exam':createExamSheet();break;case'publish-exam':publishExam();break;case'add-question':$('#question-list').insertAdjacentHTML('beforeend',questionEditor($$('.question-editor').length));break;case'attendance':attendanceSheet();break;case'cycle-att':cycleAttendance(id);break;case'grade':gradeSheet();break;case'save-grade':saveGrade();break;case'announcement':postAnnouncement();break;case'add-student':formPerson('student');break;case'add-teacher':formPerson('teacher');break;case'add-parent':formPerson('parent');break;case'save-person':savePerson(el.dataset.role);break;case'add-class':classSheet();break;case'edit-class':classSheet(id);break;case'delete-user':deletePerson(id);break;case'edit-user':editPerson(id);break;case'save-edit':saveEdit(id);break;case'bulk-delete':bulkDelete();break;case'add-subject':{let x=prompt('New subject name');if(x?.trim()&&x.trim().length<40&&!db.subjects.includes(x.trim())){db.subjects.push(x.trim());persist();render()}break;}case'exam-analytics':navTo('Analytics:'+id);break;case'export-grades':exportCSV('grades');break;case'export-att':exportCSV('attendance');break;case'print':printReport();break;case'do-print':window.print();break;case'month-prev':monthShift--;render();break;case'month-next':monthShift++;render();break;case'sort-date':sortMode='date';render();break;case'sort-score':sortMode='score';render();break;case'sort-name':sortMode='name';render();break;case'sort-level':sortMode='level';render();break;case'send-message':sendMessage(el.dataset.key);break;case'read-all':db.notifs.filter(n=>n.userId===current).forEach(n=>n.read=true);persist();render();break;case'dismiss-notif':db.notifs=db.notifs.filter(n=>n.id!==id);persist();render();break;case'tour-next':tourStep=Math.min(4,tourStep+1);render();break;case'skip-splash':activitySeq=1;render();break}}
function editPerson(id){if(me().role!=='admin')return toast('Only administrators can edit accounts.');let u=findUser(id);if(!u)return;let link=u.role==='student'?`<label>Class</label><select id="edit-class">${db.classes.map(c=>`<option value="${c.id}" ${c.id===u.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:u.role==='parent'?`<label>Linked children</label><select id="edit-links" multiple style="min-height:90px">${allStudents().map(x=>`<option value="${x.id}" ${(u.children||[]).includes(x.id)?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`:u.role==='teacher'?`<label>Assigned class</label><select id="edit-class">${db.classes.map(c=>`<option value="${c.id}" ${(u.classes||[]).includes(c.id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`:'';sheet=`<div class="bottom-sheet" data-close><div class="sheet"><div class="sheet-handle"></div><h2>Edit ${u.role}</h2><label>Name</label><input id="edit-name" class="input" value="${esc(u.name)}" maxlength="60"><label>Email</label><input id="edit-email" class="input" type="email" value="${esc(u.email)}" maxlength="100">${link}<button class="btn" data-act="save-edit" data-id="${id}" style="width:100%;margin-top:15px">Save changes</button></div></div>`;render()}
function saveEdit(id){let u=findUser(id),name=$('#edit-name')?.value.trim(),email=$('#edit-email')?.value.trim().toLowerCase();if(!u||!name||name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||db.users.some(x=>x.id!==id&&x.email===email))return toast('Enter a name and a unique, valid email.');u.name=name;u.email=email;if($('#edit-class'))u[u.role==='teacher'?'classes':'classId']=u.role==='teacher'?[$('#edit-class').value]:$('#edit-class').value;if($('#edit-links'))u.children=$$('#edit-links option:checked').map(x=>x.value);persist();sheet=null;render();toast('Account details saved.')}
function bulkDelete(){if(me().role!=='admin')return;let ids=$$('.person-check:checked').map(x=>x.value);if(!ids.length)return toast('Select at least one account.');if(!confirm(`Remove ${ids.length} selected accounts?`))return;ids.forEach(id=>{let u=findUser(id);if(u){db.users=db.users.filter(x=>x.id!==id);if(u.role==='student'){db.grades=db.grades.filter(x=>x.studentId!==id);db.attendance=db.attendance.filter(x=>x.studentId!==id);db.users.filter(x=>x.role==='parent').forEach(p=>p.children=p.children.filter(c=>c!==id))}}});persist();render();toast(`${ids.length} accounts removed.`)}
function deletePerson(id){if(me().role!=='admin')return toast('Only administrators can manage accounts.');let u=findUser(id);if(!u)return;if(!confirm(`Remove ${u.name} from the demo?`))return;db.users=db.users.filter(x=>x.id!==id);if(u.role==='student'){db.grades=db.grades.filter(x=>x.studentId!==id);db.attendance=db.attendance.filter(x=>x.studentId!==id);db.users.filter(x=>x.role==='parent').forEach(p=>p.children=p.children.filter(c=>c!==id))}persist();render();toastWithUndo(`${u.name} removed.`,()=>{db.users.push(u);persist();render()})}
function postAnnouncement(){let text=prompt('Write an update for your class and families:');if(!text?.trim()||text.trim().length>300)return;if(me().role!=='teacher'&&me().role!=='admin')return toast('Only teachers and admins can post announcements.');let a={id:uid('a'),text:text.trim(),by:me().name,kind:'normal',date:now()};db.announcements.unshift(a);if(me().role==='teacher')linked().forEach(s=>notify(s.id,'New announcement: '+a.text));persist();render();toast('Announcement shared with your community.')}
function sendMessage(key){let input=$('#message-input'),text=input?.value.trim();if(!text||text.length>500)return toast('Message should be 1–500 characters.');db.messages[key]||=[];db.messages[key].push({from:current,text,date:now(),read:false});setTimeout(()=>{db.messages[key].forEach(m=>{if(m.from!==current)m.read=true});persist()},900);persist();render();toast('Message sent.')}
function onSearch(el){searchTerm=el.value;let pos=el.selectionStart;render();let next=$('[data-search]');if(next){next.focus();next.setSelectionRange(pos,pos)}}
function bind(){document.addEventListener('click',e=>safe(()=>{if(e.target.classList.contains('bottom-sheet')){sheet=null;return render()}let b=e.target.closest('[data-act],[data-login],[data-go],[data-undo],[data-dismiss]');if(!b)return;if(b.dataset.login)return onLogin(b.dataset.login);if(b.dataset.go)return navTo(b.dataset.go);if(b.dataset.undo){undoActions[b.dataset.undo]?.();delete undoActions[b.dataset.undo];return}if(b.dataset.dismiss){toastList=toastList.filter(x=>x.id!==b.dataset.dismiss);return render()}handler(b.dataset.act,b.dataset.id,b)}));document.addEventListener('change',e=>safe(()=>{let t=e.target;if(t.id==='role-switch')return onLogin(t.value);if(t.id==='select-all'){$$('.person-check').forEach(x=>x.checked=t.checked);return}if(t.id==='child-switch'){child=t.value;return render()}if(t.id==='lang-setting'){db.settings.lang=t.value;persist();return render()}if(t.id==='theme-setting'){db.settings.theme=t.value;persist();return render()}if(t.id==='size-setting'){db.settings.textSize=t.value;persist();return render()}if(t.id==='notif-setting'){db.settings.notifications=t.checked;persist();return render()}if(t.dataset.class){if(me().role!=='admin')return;let s=findUser(t.dataset.class);if(s)s.classId=t.value;persist();return toast('Class assignment saved.')}if(t.dataset.link){let p=findUser(t.dataset.link);if(p&&me().role==='admin'){p.children=$$('option:checked',t).map(o=>o.value);persist();toast('Family links saved.')}}if(t.dataset.filter){filterValue=t.value;render()}}));document.addEventListener('input',e=>{if(e.target.matches('[data-search]'))safe(()=>onSearch(e.target))});document.addEventListener('keydown',e=>safe(()=>{if(e.key==='Escape'&&sheet){sheet=null;render()}if(focusExam&&['ArrowLeft','ArrowRight'].includes(e.key)){qAt=Math.max(0,Math.min(db.exams.find(x=>x.id===focusExam).questions.length-1,qAt+(e.key==='ArrowRight'?1:-1)));render()}if(e.key==='Enter'&&e.target.id==='login-password')handler('login')}));document.addEventListener('touchstart',e=>{if(e.target.closest('[data-swipe]'))swipeX=e.touches[0].clientX;if(e.target.closest('.sheet'))window._sheetStart=e.touches[0].clientY;if(e.target.closest('[data-notif]'))window._notifStart=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(e.target.closest('.sheet')&&window._sheetStart&&e.changedTouches[0].clientY-window._sheetStart>75){sheet=null;render()}if(e.target.closest('[data-notif]')&&window._notifStart-e.changedTouches[0].clientX>60){let row=e.target.closest('[data-notif]');db.notifs=db.notifs.filter(n=>n.id!==row.dataset.notif);persist();row.remove();toast('Notification dismissed.')}window._sheetStart=0;window._notifStart=0;if(focusExam&&swipeX){let dx=e.changedTouches[0].clientX-swipeX;if(Math.abs(dx)>65){let n=db.exams.find(x=>x.id===focusExam).questions.length;qAt=Math.max(0,Math.min(n-1,qAt+(dx<0?1:-1)));render()}swipeX=0}if(e.target.closest('[data-close]')&&e.changedTouches[0].clientY<window.innerHeight*.6){sheet=null;render()}},{passive:true})}
function initManifest(){try{let m={name:'Namaa School Demo',short_name:'Namaa',start_url:'.',display:'standalone',background_color:'#f6f5ef',theme_color:'#2d755f',description:'Offline school assessment demo'};$('#manifest').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}))}catch(e){}}
function boot(){bind();initManifest();if(current&&!db.users.some(u=>u.id===current)){current=null;db.session=null}render()}
window.addEventListener('error',e=>{console.error('Recovered UI error:',e.message);toast('The view recovered. Your saved data is safe.')});
boot();
})();</script></body></html>
